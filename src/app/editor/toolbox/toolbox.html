<section class="tools" aria-label="Drawing tools">
  @for (t of tools; track t.id) {
    <button
      class="tool"
      [class.active]="editor.tool() === t.id"
      [attr.aria-pressed]="editor.tool() === t.id"
      [title]="t.label + ' (' + t.key + ')'"
      (click)="editor.tool.set(t.id)"
    >
      <app-icon [name]="t.icon" />
      <span>{{ t.label }}</span>
      <kbd>{{ t.key }}</kbd>
    </button>
  }
</section>

<section class="catalog" aria-label="Furniture">
  <div class="catalog-head">
    <h2>Furniture</h2>
    <span class="hint">Drag onto the plan, or click to add</span>
    <div class="search">
      <app-icon name="search" />
      <input class="input" type="search" placeholder="Search furniture" [value]="query()" (input)="query.set($any($event.target).value)" />
    </div>
  </div>

  <div class="groups">
    @for (g of groups(); track g.category) {
      <div class="group">
        <button class="group-title" (click)="toggleGroup(g.category)" [attr.aria-expanded]="!collapsed().has(g.category) || !!query()">
          <span class="chev" [class.closed]="collapsed().has(g.category) && !query()">▾</span>
          {{ g.category }}
        </button>
        @if (!collapsed().has(g.category) || query()) {
          <ul>
            @for (item of g.items; track item.id) {
              <li>
                <button class="item" draggable="true" (dragstart)="onDragStart($event, item.id)" (click)="place(item.id)" [title]="'Add ' + item.name">
                  <svg [attr.viewBox]="item.viewBox" preserveAspectRatio="xMidYMid meet">
                    <g appFurnitureSymbol [shape]="item.shape" [width]="item.w" [depth]="item.d" [color]="item.color" />
                  </svg>
                  <span class="item-text">
                    <span class="item-name">{{ item.name }}</span>
                    <span class="item-size">{{ item.size }}</span>
                  </span>
                </button>
              </li>
            }
          </ul>
        }
      </div>
    } @empty {
      <p class="none">No furniture matches “{{ query() }}”.</p>
    }
  </div>
</section>
